version: "3.9"

services:
  frontend:
    build:
      context: ./Web
    container_name: wellness-frontend
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      # In Docker, we use the container name 'mongodb' as the hostname
      MONGO_URI: "mongodb://mongodb:27017/Kairos"
      NEXT_PUBLIC_URL: "http://localhost:3000"
      NEXTAUTH_URL: "http://localhost:3000"
    restart: always

  mongodb:
    image: mongo:latest
    container_name: wellness-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

volumes:
  mongodb_data: